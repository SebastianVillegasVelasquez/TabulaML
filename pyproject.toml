[tool.poetry]
name = "tabulaml"
version = "0.1.0"
description = ""
authors = ["SebastianVillegasVelasquez <villegasvelasquezs@gmail.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.13"
scikit-learn = "^1.8.0"
pandas = "^3.0.2"
numpy = "^2.4.4"
pydantic = "^2.13.3"
loguru = "^0.7.3"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
jupyter = "^1.1.1"
black = "^26.3.1"
pandas-stubs = "^3.0.0.260204"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py312"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
